name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Prepare release signing
        id: signing
        env:
          DAWN_KEYSTORE_BASE64: ${{ secrets.DAWN_KEYSTORE_BASE64 }}
          DAWN_KEYSTORE_PASSWORD: ${{ secrets.DAWN_KEYSTORE_PASSWORD }}
          DAWN_KEY_ALIAS: ${{ secrets.DAWN_KEY_ALIAS }}
          DAWN_KEY_PASSWORD: ${{ secrets.DAWN_KEY_PASSWORD }}
        run: |
          if [ -n "$DAWN_KEYSTORE_BASE64" ] && [ -n "$DAWN_KEYSTORE_PASSWORD" ] && [ -n "$DAWN_KEY_ALIAS" ] && [ -n "$DAWN_KEY_PASSWORD" ]; then
            echo "Persistent release signing secrets found; building a signed release APK."
            echo "build_task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "artifact_path=app/build/outputs/apk/release/*.apk" >> "$GITHUB_OUTPUT"
            mkdir -p app/signing
            echo "$DAWN_KEYSTORE_BASE64" | base64 --decode > app/signing/dawn-release.jks
            cat > signing.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/app/signing/dawn-release.jks
          storePassword=$DAWN_KEYSTORE_PASSWORD
          keyAlias=$DAWN_KEY_ALIAS
          keyPassword=$DAWN_KEY_PASSWORD
          EOF
          else
            echo "Persistent release signing secrets are not configured."
            echo "Falling back to the project's historical debug APK build so the artifact is valid and installable."
            echo "build_task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "artifact_path=app/build/outputs/apk/debug/*.apk" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APK
        run: ./gradlew ${{ steps.signing.outputs.build_task }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dawn-apk
          path: ${{ steps.signing.outputs.artifact_path }}
      - name: Remove signing material
        if: always()
        run: rm -rf app/signing signing.properties
